<!DOCTYPE html>
<html>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>View Incidents</title>
</head>

<body>

<div class="container mt-5">

<div class="card shadow p-4">

<h1 class="mb-4">All Incidents</h1>
<form action="/search" method="POST" class="mb-4">

    <input
        type="text"
        name="incident_id"
        class="form-control"
        placeholder="Search Incident ID">

    <br>

    <button type="submit" class="btn btn-primary">
        Search
    </button>

    <a href="/view" class="btn btn-secondary">
        Show All
    </a>

</form>

<table class="table table-striped table-hover">
    <tr>
<th>Incident ID</th>
<th>Application Name</th>
<th>Severity</th>
<th>Status</th>
<th>Created On</th>
<th>Action</th>
    </tr>

    {% for incident in incidents %}
    <tr>
<td>{{ incident[0] }}</td>
<td>{{ incident[1] }}</td>
<td>{{ incident[2] }}</td>
<td>{{ incident[3] }}</td>
<td>{{ incident[4] }}</td>
    <td>
    <a href="/edit/{{ incident[0] }}">Edit</a> |
    <a href="/delete/{{ incident[0] }}">Delete</a>
</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/">Back to Incident Form</a>

</div>

</div>

</body>

</html>
